title: BibleThought
encoding: utf-8
markdown: kramdown

kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    mdash: "--"
    ndash: "-"
    hellip: "..."
    laquo_space: "<< "
    raquo_space: " >>"


defaults:
  - scope:
      path: ""
    values:
      layout: default
